name: CI/CD Pipeline — Lab 1708

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/lab1708-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lab1708-frontend
  AWS_REGION:     ${{ secrets.AWS_REGION }}

# ─── Job 1: Semgrep SAST ──────────────────────────────────────────────────────
jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/nodejs
            p/react
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true  # Non-blocking for now; set to false when ready

# ─── Job 2: CodeQL Analysis ───────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

# ─── Job 3: Trivy Filesystem Scan ────────────────────────────────────────────
  trivy-fs:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

# ─── Job 4: Run Backend Tests ─────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [semgrep, codeql, trivy-fs]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_chars!!
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_chars
        run: npm test

# ─── Job 5: Build, Scan Images, Push to Docker Hub ───────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend ──
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ──
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}

# ─── Job 6: Deploy to AWS Elastic Beanstalk ───────────────────────────────────────
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: [build-and-push]          # only runs after images are on Docker Hub
    if: github.ref == 'refs/heads/main'  # only on pushes to main, not PRs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Update Dockerrun.aws.json to use the exact SHA-tagged image
      # so EB always pulls the image built in THIS pipeline run
      - name: Pin image tag in Dockerrun.aws.json
        run: |
          sed -i \
            "s|REPLACE_WITH_YOUR_DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" \
            Dockerrun.aws.json
          sed -i \
            "s|:latest|:${{ github.sha }}|g" \
            Dockerrun.aws.json
          echo "Dockerrun.aws.json after update:"
          cat Dockerrun.aws.json

      # Package the Dockerrun.aws.json into a ZIP — EB expects a zip bundle
      - name: Create deployment bundle
        run: zip deploy.zip Dockerrun.aws.json

      # Upload the bundle to the S3 bucket EB uses, then trigger a deployment
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key:       ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key:       ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name:     ${{ secrets.EB_APPLICATION_NAME }}
          environment_name:     ${{ secrets.EB_ENVIRONMENT_NAME }}
          region:               ${{ secrets.AWS_REGION }}
          version_label:        lab1708-${{ github.sha }}
          deployment_package:   deploy.zip
          wait_for_environment_recovery: 120

      # Print a summary visible in the GitHub Actions UI
      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend image** | \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **EB Application** | ${{ secrets.EB_APPLICATION_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **EB Environment** | ${{ secrets.EB_ENVIRONMENT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | Deployed ✅ |" >> $GITHUB_STEP_SUMMARY
