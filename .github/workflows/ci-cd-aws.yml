# ============================================================
# CI/CD Pipeline → AWS Deployment
# ============================================================
# WHAT THIS FILE DOES (in order):
#
#  CI (Continuous Integration) — runs on EVERY push and PR
#  ├── Job 1: Semgrep    — scans source code for security bugs
#  ├── Job 2: CodeQL     — deep vulnerability analysis (GitHub)
#  ├── Job 3: Trivy FS   — scans dependencies for known CVEs
#  └── Job 4: Jest Tests — runs backend unit/integration tests
#
#  CD (Continuous Delivery) — runs only on push to main
#  ├── Job 5: Docker Build — builds backend + frontend images
#  │          Trivy Image  — scans built images for CVEs
#  │          Docker Push  — pushes tagged images to Docker Hub
#  └── Job 6: AWS Deploy  — choose ONE option:
#        Option A (PaaS): Elastic Beanstalk  ← ACTIVE BY DEFAULT
#        Option B (IaaS): EC2 via SSM        ← commented out
#
# ── HOW TO SWITCH BETWEEN PaaS AND IaaS ─────────────────────
#  PaaS (Elastic Beanstalk) — active right now:
#    deploy-eb block below is UNCOMMENTED
#    deploy-ec2 block below is COMMENTED OUT
#
#  IaaS (EC2 + VPC + ALB) — to activate:
#    1. Comment out the deploy-eb block (add # to each line)
#    2. Uncomment the deploy-ec2 block (remove # from each line)
#
# ── SECRETS REQUIRED ─────────────────────────────────────────
#  Common (both EB and EC2):
#    DOCKERHUB_USERNAME       Your Docker Hub username
#    DOCKERHUB_TOKEN          Docker Hub access token
#    AWS_ACCESS_KEY_ID        IAM user programmatic key
#    AWS_SECRET_ACCESS_KEY    IAM user secret
#    AWS_REGION               e.g. us-east-1
#    VITE_API_URL             e.g. http://your-eb-url.elasticbeanstalk.com/api
#    VITE_SOCKET_URL          e.g. http://your-eb-url.elasticbeanstalk.com
#
#  Elastic Beanstalk only:
#    EB_APPLICATION_NAME      e.g. lab1708-reservation
#    EB_ENVIRONMENT_NAME      e.g. lab1708-env
#
#  EC2 only:
#    EC2_INSTANCE_IDS         e.g. i-0abc123def456,i-0def456abc123
#                             (comma-separated, one per AZ)
# ============================================================

# ── DISABLED ── Switch back to push trigger when deploying to AWS ──────────────
# To re-enable: change the trigger below back to:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
# ────────────────────────────────────────────────────────────────────────────────
name: CI/CD → AWS

on:
  workflow_dispatch:   # manual trigger only — won't run on git push

env:
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/lab1708-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lab1708-frontend
  AWS_REGION:     ${{ secrets.AWS_REGION }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — TRIVY FILESYSTEM SCAN
# NOTE: Semgrep (requires SEMGREP_APP_TOKEN) and CodeQL (requires GitHub
# Advanced Security to be enabled) have been removed to keep the pipeline
# clean. Trivy covers CVE scanning for both dependencies and Docker images.
# To re-add them, see the git history for the original configuration.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
# Scans package-lock.json and package.json in both backend/ and frontend/
# against the NVD CVE database. Catches vulnerable npm packages
# (e.g. a known RCE in an Express middleware version) BEFORE they
# are baked into a Docker image and shipped to AWS.
# Pipeline stops here if CRITICAL or HIGH severity CVEs are found.
# ─────────────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: "🛡️ Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan source files and npm dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref:  .
          severity:  CRITICAL,HIGH
          exit-code: 1
          format:    table

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — BACKEND TESTS
# Jest + Supertest integration tests with a mocked Prisma client.
# No real database needed — tests run in memory.
# What is tested:
#   - Auth: register, login, token refresh, 401 on missing token
#   - Reservations: past booking rejected, conflict detection (409),
#     24-hour cancellation rule, technologist exemption from 24h rule
# JWT_SECRET here is a dummy — real secrets are only in GitHub Secrets.
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Backend Tests (Jest)"
    runs-on: ubuntu-latest
    # Security scans run independently — tests don't wait for them
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run test suite
        working-directory: backend
        env:
          NODE_ENV:           test
          JWT_SECRET:         test_jwt_secret_minimum_32_chars!!
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_chars
        run: npm test

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — BUILD DOCKER IMAGES, SCAN THEM, PUSH TO DOCKER HUB
#
# Backend Dockerfile stages:
#   builder     → installs all npm deps, generates Prisma client
#   production  → prod deps only, non-root user, 180MB final image
#
# Frontend Dockerfile stages:
#   builder     → npm ci + vite build (VITE_API_URL baked into JS bundle)
#   production  → nginx:alpine serves static files only (24MB final image)
#
# Each image is scanned with Trivy AFTER build but BEFORE push.
# This catches OS-level CVEs in the Alpine base image.
#
# Tags pushed: :latest  AND  :git-commit-sha
# The SHA tag lets you identify exactly which commit is running on AWS.
# ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "🐳 Build, Scan & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── BACKEND IMAGE ────────────────────────────────────────────────────────
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context:    ./backend
          push:       false      # hold — scan before pushing
          load:       true
          tags:       ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy — scan backend image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true  # advisory only — never block the push
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity:  CRITICAL,HIGH
          exit-code: 0           # report CVEs but don't block the pipeline
          format:    table

      - name: Push backend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push:    true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── FRONTEND IMAGE ───────────────────────────────────────────────────────
      # VITE_API_URL and VITE_SOCKET_URL are build-time arguments.
      # They get compiled into the JavaScript bundle — update these secrets
      # whenever your AWS URL changes (e.g. after recreating the EB environment).
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    false
          load:    true
          tags:    ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy — scan frontend image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true  # advisory only — never block the push
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity:  CRITICAL,HIGH
          exit-code: 0
          format:    table

      - name: Push frontend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 6A — DEPLOY TO ELASTIC BEANSTALK (PaaS)  ← ACTIVE BY DEFAULT
#
# WHAT ELASTIC BEANSTALK DOES (PaaS):
#   You provide: a zip file containing Dockerrun.aws.json
#   EB provides: EC2 instance, OS, Docker runtime, health checks,
#                auto scaling, load balancer, deployments, monitoring
#
# HOW IT WORKS STEP BY STEP:
#   1. sed replaces the placeholder Docker Hub username in Dockerrun.aws.json
#   2. sed pins the image tag to the exact git SHA (reproducible deploys)
#   3. The file is zipped into deploy.zip (EB expects a zip archive)
#   4. beanstalk-deploy action:
#      a. Uploads deploy.zip to the S3 bucket EB manages
#      b. Creates a new Application Version named lab1708-<SHA>
#      c. Tells EB to deploy that version to lab1708-env
#      d. Waits up to 120s for the environment to return to Green health
#   5. EB EC2 instance pulls the new Docker image from Docker Hub
#   6. Old container stops, new container starts
#
# PREREQUISITE SETUP (one time, done manually before first pipeline run):
#   1. Install EB CLI: pip3 install awsebcli
#   2. cd to project root: eb init (choose Docker, us-east-1)
#   3. eb create lab1708-env --instance-type t3.nano --single
#   4. Set env vars in EB Console → Configuration → Environment properties
#   5. Run migrations: eb ssh → docker exec → prisma migrate deploy
# ─────────────────────────────────────────────────────────────────────────────
  deploy-eb:
    name: "☁️ Deploy → Elastic Beanstalk (PaaS)"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Inject username and SHA into compose file for EB
        # Replace placeholders in eb-docker-compose.yml:
        # DOCKERHUB_USERNAME  → actual Docker Hub username
        # :latest             → exact commit SHA for reproducible deploys
        run: |
          sed -i \
            "s|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" \
            eb-docker-compose.yml

          sed -i \
            "s|:latest|:${{ github.sha }}|g" \
            eb-docker-compose.yml

          echo "Compose file after injection:"
          cat eb-docker-compose.yml

      - name: Create deployment bundle (zip)
        # Bundle the compose file + nginx config for EB.
        # EB on AL2023 uses docker-compose.yml to run all containers.
        run: |
          cp eb-docker-compose.yml docker-compose.yml
          zip deploy.zip docker-compose.yml nginx/nginx.conf

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key:       ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key:       ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name:     ${{ secrets.EB_APPLICATION_NAME }}
          environment_name:     ${{ secrets.EB_ENVIRONMENT_NAME }}
          region:               ${{ secrets.AWS_REGION }}
          version_label:        "lab1708-${{ github.sha }}"   # unique per commit
          deployment_package:   deploy.zip
          wait_for_environment_recovery: 120   # seconds to wait for Green health

      - name: Print deployment summary
        run: |
          echo "## ✅ Deployed to Elastic Beanstalk (PaaS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| EB Application | ${{ secrets.EB_APPLICATION_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EB Environment | ${{ secrets.EB_ENVIRONMENT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend image | \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment type | PaaS — AWS manages the infrastructure |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Remember to **terminate the environment** after learning to avoid charges:" >> $GITHUB_STEP_SUMMARY
          echo "> \`eb terminate ${{ secrets.EB_ENVIRONMENT_NAME }}\`" >> $GITHUB_STEP_SUMMARY

