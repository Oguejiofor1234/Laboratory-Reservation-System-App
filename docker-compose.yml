version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lab1708-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab1708
      POSTGRES_PASSWORD: lab1708_secret
      POSTGRES_DB: lab1708
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab1708"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: builder   # Use builder stage for dev (includes devDeps + nodemon)
    container_name: lab1708-backend
    restart: unless-stopped
    command: npm run dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lab1708:lab1708_secret@postgres:5432/lab1708
      NODE_ENV: development
      PORT: 5000
    volumes:
      - ./backend/src:/app/src
      - ./backend/server.js:/app/server.js
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: builder
    container_name: lab1708-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost/api
      VITE_SOCKET_URL: http://localhost
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ─── Nginx (reverse proxy) ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lab1708-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
