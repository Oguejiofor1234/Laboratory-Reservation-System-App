# ============================================================
# CI/CD Pipeline → Render Deployment
# ============================================================
# WHAT THIS FILE DOES (in order):
#
#  CI (Continuous Integration) — runs on EVERY push and PR
#  ├── Job 1: Semgrep    — scans source code for security bugs
#  ├── Job 2: CodeQL     — deep vulnerability analysis (GitHub)
#  ├── Job 3: Trivy FS   — scans dependencies for known CVEs
#  └── Job 4: Jest Tests — runs backend unit/integration tests
#
#  CD (Continuous Delivery) — runs only on push to main
#  ├── Job 5: Docker Build — builds backend + frontend images
#  │          Trivy Image  — scans the built images for CVEs
#  │          Docker Push  — pushes tagged images to Docker Hub
#  └── Job 6: Render Deploy — triggers Render deploy hooks
#                             (backend + frontend update live)
#
# SECRETS REQUIRED (GitHub → Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME       Your Docker Hub username
#   DOCKERHUB_TOKEN          Docker Hub access token
#   RENDER_DEPLOY_HOOK_BACKEND   From Render dashboard → backend service
#   RENDER_DEPLOY_HOOK_FRONTEND  From Render dashboard → frontend service
#   VITE_API_URL             e.g. https://lab1708-api.onrender.com/api
#   VITE_SOCKET_URL          e.g. https://lab1708-api.onrender.com
#
# HOW TO GET RENDER DEPLOY HOOKS:
#   1. Go to https://dashboard.render.com
#   2. Click your service (backend or frontend)
#   3. Settings → Deploy Hook → copy the URL
# ============================================================

name: CI/CD → Render

on:
  push:
    branches: [main]          # full pipeline: CI + CD + deploy
  pull_request:
    branches: [main]          # CI only (deploy job is skipped on PRs)

# Shared image name variables — change only here if you rename
env:
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/lab1708-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lab1708-frontend

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — SEMGREP SAST
# Static Application Security Testing: scans your JavaScript/JSX
# source files for security anti-patterns BEFORE code runs anywhere.
# Catches: hardcoded secrets, SQL injection, XSS, insecure configs, etc.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  semgrep:
    name: "🔍 Semgrep SAST"
    runs-on: ubuntu-latest
    permissions:
      security-events: write    # allows uploading SARIF results to GitHub Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep security scan
        uses: semgrep/semgrep-action@v1
        with:
          # Ruleset breakdown:
          #   p/security-audit  → OWASP Top 10 patterns
          #   p/secrets         → exposed credentials / API keys
          #   p/nodejs          → Node.js-specific vulnerabilities
          #   p/react           → React/JSX-specific vulnerabilities
          config: >-
            p/security-audit
            p/secrets
            p/nodejs
            p/react
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true   # non-blocking: won't stop pipeline on findings
                                  # change to false when ready for strict enforcement

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — CODEQL ANALYSIS
# GitHub's own semantic code analysis engine. Builds a model of your
# code's data flow and finds vulnerabilities that pattern-matching misses:
# auth bypasses, path traversal, prototype pollution, etc.
# Results appear in: GitHub repo → Security → Code scanning alerts
# ─────────────────────────────────────────────────────────────────────────────
  codeql:
    name: "🔬 CodeQL Analysis"
    runs-on: ubuntu-latest
    permissions:
      actions:        read
      contents:       read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL engine
        uses: github/codeql-action/init@v3
        with:
          languages: javascript   # covers JS and JSX (both backend and frontend)
          queries: security-and-quality

      - name: Autobuild project
        uses: github/codeql-action/autobuild@v3   # auto-detects Node.js

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — TRIVY FILESYSTEM SCAN
# Scans your package.json dependency trees for known CVEs
# (Common Vulnerabilities and Exposures) from the NVD database.
# Example: if express@4.x has a critical RCE, this catches it HERE
# before it gets baked into a Docker image.
# exit-code: 1 means CRITICAL/HIGH findings BLOCK the rest of the pipeline.
# ─────────────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: "🛡️ Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan project files and dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs          # filesystem scan (not an image scan)
          scan-ref:  .           # scan from project root
          severity:  CRITICAL,HIGH
          exit-code: 1           # fail pipeline if CRITICAL or HIGH found
          format:    table       # human-readable output in logs

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — BACKEND UNIT TESTS
# Runs Jest + Supertest tests against a mocked database.
# Tests cover: auth flow, booking conflict detection, 24h cancel rule, etc.
# Uses dummy JWT secrets — never real credentials in workflow files.
# Only runs AFTER all three security scans complete (needs: [...]).
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Backend Tests (Jest)"
    runs-on: ubuntu-latest
    needs: [semgrep, codeql, trivy-fs]   # wait for all security scans
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json   # cache key from lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci   # clean install — faster and deterministic vs npm install

      - name: Run test suite
        working-directory: backend
        env:
          NODE_ENV:           test
          JWT_SECRET:         test_jwt_secret_minimum_32_chars!!      # dummy — tests only
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_chars    # dummy — tests only
        run: npm test

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — BUILD DOCKER IMAGES, SCAN, PUSH TO DOCKER HUB
# Only runs on push to main (not on pull requests).
# Two sub-sections: backend image, then frontend image.
# Each follows: build → Trivy image scan → push to Docker Hub.
# Images are tagged with BOTH the git commit SHA and 'latest'.
# The SHA tag gives you a permanent, traceable snapshot per commit.
# ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "🐳 Build, Scan & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [test]                         # tests must pass first
    if: github.ref == 'refs/heads/main'   # only on main branch pushes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3   # enables multi-platform builds + caching

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── BACKEND ─────────────────────────────────────────────────────────────
      # Stage 1 (builder): npm ci + prisma generate
      # Stage 2 (production): prod deps only, no devDependencies, non-root user
      - name: Build backend image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context:    ./backend
          push:       false        # don't push yet — scan first
          load:       true         # load into local Docker daemon for Trivy
          tags:       ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha     # GitHub Actions cache — faster rebuilds
          cache-to:   type=gha,mode=max

      - name: Scan backend image for OS + package CVEs
        uses: aquasecurity/trivy-action@master
        continue-on-error: true   # advisory — report CVEs but never block the push
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity:  CRITICAL,HIGH
          exit-code: 0
          format:    table

      - name: Push backend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push:    true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── FRONTEND ────────────────────────────────────────────────────────────
      # Stage 1 (builder): npm ci + vite build (bakes VITE_API_URL into JS)
      # Stage 2 (production): nginx alpine serving static files only (24MB)
      # IMPORTANT: VITE_API_URL must point to your Render backend service URL
      - name: Build frontend image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    false
          load:    true
          tags:    ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan frontend image for OS + package CVEs
        uses: aquasecurity/trivy-action@master
        continue-on-error: true   # advisory — report CVEs but never block the push
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity:  CRITICAL,HIGH
          exit-code: 0
          format:    table

      - name: Push frontend image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 6 — DEPLOY TO RENDER
# Triggers Render's deploy hooks with a single HTTP POST request.
# Render then pulls the :latest image from Docker Hub and restarts
# the service with zero downtime (blue/green rolling deploy).
#
# How Render deploy hooks work:
#   1. You create a service on Render (Web Service → Docker)
#   2. Render gives you a webhook URL for that service
#   3. POST to that URL → Render pulls the new image → service restarts
#
# This job triggers BOTH the backend AND frontend services independently.
# Each has its own hook URL stored as a separate GitHub secret.
# ─────────────────────────────────────────────────────────────────────────────
  deploy-render:
    name: "🚀 Deploy to Render"
    runs-on: ubuntu-latest
    needs: [build-and-push]               # images must be on Docker Hub first
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger backend deployment on Render
        run: |
          echo "Triggering backend deploy..."
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}")
          echo "Render backend response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "Backend deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Backend deployment triggered successfully"

      - name: Trigger frontend deployment on Render
        run: |
          echo "Triggering frontend deploy..."
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}")
          echo "Render frontend response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "Frontend deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Frontend deployment triggered successfully"

      - name: Print deployment summary
        run: |
          echo "## ✅ Deployed to Render" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend image | \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend image | \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend URL | Check Render dashboard |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend URL | Check Render dashboard |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Render typically takes 2–5 minutes to complete the deployment." >> $GITHUB_STEP_SUMMARY
