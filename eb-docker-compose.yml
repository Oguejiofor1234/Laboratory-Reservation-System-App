version: '3.8'

# ── Elastic Beanstalk production compose ──────────────────────────────────────
# Uses pre-built images from Docker Hub (built by CI/CD pipeline).
# The CI/CD pipeline replaces DOCKERHUB_USERNAME and :latest with the
# actual username and commit SHA before deploying to EB.
#
# EB listens on port 80 (nginx) which proxies to backend on port 5000.
# ──────────────────────────────────────────────────────────────────────────────

services:

  backend:
    image: DOCKERHUB_USERNAME/lab1708-backend:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      # All other secrets (DATABASE_URL, JWT_SECRET, etc.) are set as
      # EB environment properties via AWS Console or eb setenv
    expose:
      - "5000"

  frontend:
    image: DOCKERHUB_USERNAME/lab1708-frontend:latest
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"        # EB routes all traffic through port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
