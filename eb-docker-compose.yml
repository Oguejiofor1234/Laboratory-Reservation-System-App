version: '3.8'

# ── Elastic Beanstalk production compose ──────────────────────────────────────
# Uses pre-built images from Docker Hub (built by CI/CD pipeline).
# The CI/CD pipeline replaces DOCKERHUB_USERNAME and :latest with the
# actual username and commit SHA before deploying to EB.
#
# EB listens on port 80 (nginx) which proxies to backend on port 5000.
# ──────────────────────────────────────────────────────────────────────────────

services:

  backend:
    image: DOCKERHUB_USERNAME/lab1708-backend:latest
    restart: always
    # Pass every EB environment property into the container.
    # EB sets these as host env vars; docker-compose interpolates them.
    environment:
      NODE_ENV:              ${NODE_ENV}
      PORT:                  ${PORT}
      DATABASE_URL:          ${DATABASE_URL}
      JWT_SECRET:            ${JWT_SECRET}
      JWT_REFRESH_SECRET:    ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN:        ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      EMAIL_HOST:            ${EMAIL_HOST}
      EMAIL_PORT:            ${EMAIL_PORT}
      EMAIL_SECURE:          ${EMAIL_SECURE}
      EMAIL_USER:            ${EMAIL_USER}
      EMAIL_PASS:            ${EMAIL_PASS}
      EMAIL_FROM:            ${EMAIL_FROM}
      CONTACT_RECIPIENT:     ${CONTACT_RECIPIENT}
      CLIENT_URL:            ${CLIENT_URL}
    expose:
      - "5000"

  frontend:
    image: DOCKERHUB_USERNAME/lab1708-frontend:latest
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"        # EB routes all traffic through port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
